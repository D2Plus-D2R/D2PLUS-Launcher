name: Launcher bug
description: Report a reproducible D2PLUS Launcher problem
title: "[Alpha 0.0.2] "
body:
  - type: markdown
    attributes:
      value: "Remove personal paths and account details from logs. Do not upload your only copy of a character save."
  - type: input
    id: versions
    attributes:
      label: Launcher, Windows and D2R executable versions
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant sanitized logs or screenshots
  - type: dropdown
    id: overlay
    attributes:
      label: Damage numbers
      options:
        - Disabled
        - Enabled
        - Not applicable
