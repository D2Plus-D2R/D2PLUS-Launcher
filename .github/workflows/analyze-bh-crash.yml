name: Analyze BH 1.9.9 runtime crash
on:
  push:
    branches: [slashdiablo-bh-crash-analysis]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disassemble-crash:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect exact BH release DLL at RVA 0x95CE9
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-mingw-w64-i686
          curl -fL --retry 3 -o BH.dll https://github.com/planqi/slashdiablo-maphack/releases/download/1.9.9/BH.dll
          sha256sum BH.dll
          python3 - <<'PY'
          import struct
          data=open('BH.dll','rb').read()
          pe=struct.unpack_from('<I',data,0x3c)[0]
          opt=pe+24
          base=struct.unpack_from('<I',data,opt+28)[0]
          nsec=struct.unpack_from('<H',data,pe+6)[0]
          section=opt+struct.unpack_from('<H',data,pe+20)[0]
          rva=0x95CE9
          print(f'BH DLL image base 0x{base:08X}; failing RVA 0x{rva:X}; virtual address 0x{base+rva:X}')
          for i in range(nsec):
              ent=section+40*i
              name=data[ent:ent+8].split(b'\0')[0].decode()
              virtual_size, virtual_addr, raw_size, raw_offset=struct.unpack_from('<IIII',data,ent+8)
              print(f'section {name}: RVA 0x{virtual_addr:08X} size {virtual_size}; file 0x{raw_offset:X} size {raw_size}')
              if virtual_addr<=rva<virtual_addr+max(virtual_size,raw_size):
                  off=raw_offset+rva-virtual_addr
                  print(f'ERROR_SITE: file offset 0x{off:X}; context hex {data[off-36:off+48].hex(" ")}')
                  # The binary slice includes a little extra; disassemble from multiple preceding offsets
                  # to avoid an invalid first-instruction boundary.
                  st=off-0x200
                  open('crash_slice.bin','wb').write(data[st:off+0x180])
                  open('crash_address.txt','w').write(str(rva-0x200))
          PY
          printf 'Relevant static strings and nearby bytes:\\n'
          python3 - <<'PY'
          import struct
          d=open("BH.dll","rb").read()
          pe=struct.unpack_from("<I",d,0x3c)[0];opt=pe+24
          n=struct.unpack_from("<H",d,pe+6)[0]
          start=opt+struct.unpack_from("<H",d,pe+20)[0]
          def off(rva):
              for i in range(n):
                  b=start+40*i
                  size,va,rawsize,rawoff=struct.unpack_from("<IIII",d,b+8)
                  if va<=rva<va+max(size,rawsize): return rawoff+rva-va
              return -1
          for addr in [0x107B3C,0x107B44,0x95CB3,0x99260,0x3A910]:
              p=off(addr)
              print(f'RVA 0x{addr:X}, file offset 0x{p:X}:', repr(d[p:p+64]))
          PY
          printf 'Disassembly near called function 0x99260 (RVA):\\n'
          python3 - <<'PY'
          import struct
          d=open("BH.dll","rb").read(); pe=struct.unpack_from("<I",d,0x3c)[0];o=pe+24
          n=struct.unpack_from("<H",d,pe+6)[0];start=o+struct.unpack_from("<H",d,pe+20)[0]
          for addr in [0x99260,0x3A910]:
              for i in range(n):
                  b=start+40*i;sz,va,rs,off=struct.unpack_from("<IIII",d,b+8)
                  if va<=addr<va+max(sz,rs):
                      p=off+addr-va
                      open(f"fn_{addr:x}.bin","wb").write(d[p-0x20:p+0x150])
                      break
          PY
          objdump -D -b binary -m i386 -M intel --adjust-vma=$((0x99260-0x20)) fn_99260.bin | head -n 100
          objdump -D -b binary -m i386 -M intel --adjust-vma=$((0x3A910-0x20)) fn_3a910.bin | head -n 90
          printf 'Disassembly near the crash site (RVA):\n'
          objdump -D -b binary -m i386 -M intel --adjust-vma=$((0x95CE9-0x200)) crash_slice.bin | tail -n 220
