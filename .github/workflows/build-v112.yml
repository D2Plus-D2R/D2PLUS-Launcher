name: Build Alpha V1.1.2 packages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: alpha-v112-packages
  cancel-in-progress: false
jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-v112]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install Pillow==11.3.0
      - run: python build/unpack-suite.py
      - run: npm ci --ignore-scripts
      - name: Prepare and verify both gameplay formats
        run: python build/prepare-v112.py
      - name: Test launcher and companion data
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: choco install nsis --version=3.11 --yes --no-progress
      - name: Build full Windows launcher
        run: python build/package.py --makensis 'C:/Program Files (x86)/NSIS/makensis.exe'
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python build/publish-v112.py
