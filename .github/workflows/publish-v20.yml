name: Publish Alpha V2.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v20.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: alpha-v20-publication
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install Pillow==11.3.0
      - run: npm ci --ignore-scripts
      - name: Build website and final V2.0 reference
        run: python build/site.py
      - name: Build complete D2RMM package and launcher payload
        run: python build/prepare-v20.py
      - name: Rebuild website with final V2.0 gameplay metadata
        run: python build/site.py
      - name: Build standalone offline wiki from the final reference
        run: python build/package-wiki-v20.py
      - name: Validate full gameplay package and reference
        run: python build/validate-v20.py
      - name: Test launcher and reference interface
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/ritual-lab.test.mjs test/ritual-lab-ui.test.mjs test/charms-v13.test.mjs test/release-v20.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: choco install nsis --version=3.11 --yes --no-progress
      - name: Build full Windows launcher
        run: python build/package.py --makensis 'C:/Program Files (x86)/NSIS/makensis.exe'
      - name: Ensure pinned Android verification tools
        run: |
          if (-not $env:ANDROID_HOME) { throw 'Android SDK is required to verify the signed APK.' }
          $androidVerifier = Join-Path $env:ANDROID_HOME 'build-tools/35.0.0/apksigner.bat'
          if (-not (Test-Path -LiteralPath $androidVerifier)) {
            $androidManager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
            & $androidManager 'build-tools;35.0.0'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Publish verified packages before changing download links
        env:
          GH_TOKEN: ${{ github.token }}
        run: python build/publish-v20.py
      - name: Record published package checksums
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gameplay/manifest.json gameplay/release.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m 'Record published Alpha V2.0 checksums [publish-v20]'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          exit 0
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified V2.0 website
        id: deployment
        uses: actions/deploy-pages@v4
