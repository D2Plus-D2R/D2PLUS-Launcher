name: Publish D2PLUS page
on:
  push:
    branches: [main]
    paths: ['site/**', 'build/site.py', 'build/seo.py', 'build/screenshots.py', 'test/test_seo.py', '.github/workflows/pages.yml']
  workflow_dispatch:
  workflow_run:
    workflows: [Build AlphaV1.1 Hotfix 1 packages, Publish signed Android v0.8]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: (github.event_name == 'push' && !contains(github.event.head_commit.message, '[publish-v11-hotfix1]') && !contains(github.event.head_commit.message, '[publish-android-v08]') && !contains(github.event.head_commit.message, '[publish-v122]') && !contains(github.event.head_commit.message, '[publish-v13]') && !contains(github.event.head_commit.message, '[publish-v14]') && !contains(github.event.head_commit.message, '[publish-v20]') && !contains(github.event.head_commit.message, '[publish-v20a]')) || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Build the public landing page
        run: python3 build/site.py
      - name: Validate public search metadata and discovery
        run: |
          python3 -m unittest discover -s test -p "test_seo.py"
          python3 build/seo.py --check --output _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
