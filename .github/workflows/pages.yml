name: Publish D2PLUS page
on:
  push:
    branches: [main]
    paths: ['site/**', 'build/site.py', '.github/workflows/pages.yml']
  workflow_dispatch:
  workflow_run:
    workflows: [Build Alpha v0.8 packages]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: (github.event_name == 'push' && !contains(github.event.head_commit.message, '[publish-v08]')) || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Build the public landing page
        run: python3 build/site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
