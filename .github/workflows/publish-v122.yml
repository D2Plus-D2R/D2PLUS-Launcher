name: Publish Alpha V1.2.2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v122.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: alpha-v122-publication
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install Pillow==11.3.0
      - run: npm ci --ignore-scripts
      - name: Prepare website and offline reference
        run: python build/site.py
      - name: Download the hash-pinned Alpha V1.2 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: python build/download-v12.py
      - name: Build complete D2RMM package and launcher payload
        run: python build/prepare-v122.py
      - name: Verify the complete D2RMM install script
        run: python build/validate-v122.py
      - name: Test launcher and reference interface
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/ritual-lab.test.mjs test/ritual-lab-ui.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: choco install nsis --version=3.11 --yes --no-progress
      - name: Build full Windows launcher
        run: python build/package.py --makensis 'C:/Program Files (x86)/NSIS/makensis.exe'
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python build/publish-v122.py
      - name: Record the published package checksums
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gameplay/manifest.json gameplay/release.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m 'Record published Alpha V1.2.2 checksums [publish-v122]'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          exit 0
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy updated website
        id: deployment
        uses: actions/deploy-pages@v4
