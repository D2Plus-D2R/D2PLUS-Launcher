name: Build Alpha v0.8 packages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: alpha-v08-build
  cancel-in-progress: false
jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-v08]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.3'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Unpack companion sources
        run: python build/unpack-suite.py
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Validate launcher and companion data
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reconstruct checksum-verified gameplay inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python build/reconstruct-gameplay.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python build/fetch-release-inputs.py --input-dir dist
      - name: Install NSIS compiler
        run: choco install nsis --version=3.11 --yes --no-progress
      - name: Build Windows packages
        run: python build/package.py --makensis 'C:/Program Files (x86)/NSIS/makensis.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: D2PLUS-Alpha-v0.8-Windows
          path: |
            dist/*.exe
            dist/D2PLUS_Launcher_Portable_*.zip
          if-no-files-found: error
      - name: Build unsigned Android reference update kit
        run: python build/package-android-kit.py
      - name: Package references and release source
        run: python build/package-release-extras.py
      - name: Publish the verified Alpha v0.8 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python build/publish-release.py
