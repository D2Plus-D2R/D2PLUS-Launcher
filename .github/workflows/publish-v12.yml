name: Publish Alpha V1.2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v12.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: alpha-v12-publication
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-latest
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply the hash-pinned, reviewed source update
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          from pathlib import Path,PurePosixPath
          import hashlib,io,json,os,subprocess,urllib.request,urllib.parse,zipfile
          root=Path.cwd()
          expected='6841aac5ef22e039d8f30b71709716a9b2e0780efe2f9ef6629aadf28226fe81'
          class Redirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  result=super().redirect_request(req,fp,code,msg,headers,newurl)
                  if result and urllib.parse.urlparse(newurl).hostname!='api.github.com':result.remove_header('Authorization')
                  return result
          opener=urllib.request.build_opener(Redirect())
          def get(url,accept='application/vnd.github+json'):
              assert urllib.parse.urlparse(url).hostname=='api.github.com'
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':accept,'User-Agent':'D2PLUS-v12-build'})
              with opener.open(req,timeout=180) as response:return response.read()
          releases=json.loads(get('https://api.github.com/repos/D2Plus-D2R/D2PLUS-Launcher/releases?per_page=100'))
          release=next(r for r in releases if r['tag_name']=='v1.2-alpha' or r.get('name')=='D2PLUS Alpha V1.2')
          asset=next(a for a in release['assets'] if a['name']=='D2PLUS_AlphaV1.2_Launcher_Source_Update.zip')
          data=get(asset['url'],'application/octet-stream')
          assert hashlib.sha256(data).hexdigest()==expected,'Source archive checksum mismatch'
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              manifest=json.loads(z.read('SOURCE_UPDATE.json'));names=[]
              for row in manifest['files']:
                  name=row['path'];p=PurePosixPath(name)
                  assert not p.is_absolute() and '..' not in p.parts and ':' not in name and '\\' not in name
                  assert not name.startswith(('.git/','.github/')) and (root/name).resolve().is_relative_to(root)
                  contents=z.read(name);assert hashlib.sha256(contents).hexdigest()==row['sha256']
                  prior=subprocess.run(['git','show','HEAD:'+name],capture_output=True)
                  priorhash=hashlib.sha256(prior.stdout).hexdigest() if prior.returncode==0 else None
                  assert priorhash in [row['beforeSha256'],row['sha256']],'Repository changed: '+name
                  target=root/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(contents);names.append(name)
          # GitHub's web draft editor can retain an internal untagged name until publication.
          helper=root/'build/release-api-v12.py'
          helper.write_text(helper.read_text().replace("r['tag_name']=='v1.2-alpha'", "(r['tag_name']=='v1.2-alpha' or r.get('name')=='D2PLUS Alpha V1.2')"))
          publisher=root/'build/publish-v12.py'
          publisher.write_text(publisher.read_text().replace("{'target_commitish':head", "{'tag_name':'v1.2-alpha','target_commitish':head"))
          (root/'.release-source-paths.json').write_text(json.dumps(names))
          print('Applied',len(names),'verified source files.')
      - run: python build/unpack-suite.py
      - run: npm ci --ignore-scripts
      - name: Download verified gameplay input
        env:
          GH_TOKEN: ${{ github.token }}
        run: python build/download-v12.py
      - run: python build/prepare-v12.py
      - name: Test launcher and user interface
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: choco install nsis --version=3.11 --yes --no-progress
      - name: Build full Windows launcher
        run: python build/package.py --makensis 'C:/Program Files (x86)/NSIS/makensis.exe'
      - name: Commit release source and website
        id: source
        shell: python
        run: |
          import json,os,subprocess
          from pathlib import Path
          paths=json.loads(Path('.release-source-paths.json').read_text())
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+paths,check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode:
              subprocess.run(['git','commit','-m','Release Alpha V1.2: Lilith, boss visuals and targeting fixes'],check=True)
              subprocess.run(['git','push','origin','HEAD:main'],check=True)
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('commit='+head+'\n')
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python build/publish-v12.py
      - uses: actions/configure-pages@v5
      - run: python build/site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy updated website
        id: deployment
        uses: actions/deploy-pages@v4
