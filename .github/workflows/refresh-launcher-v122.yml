name: Refresh Alpha V1.2.2 launcher
on:
  push:
    branches: [main]
    paths: ['.github/workflows/refresh-launcher-v122.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: alpha-v122-publication
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: python build/site.py
      - name: Prepare reference data and preserve published gameplay
        env:
          GH_TOKEN: ${{ github.token }}
        run: python build/prepare-launcher-v122.py
      - name: Verify launcher and map toggle
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: choco install nsis --version=3.11 --yes --no-progress
      - run: python build/package.py --makensis 'C:/Program Files (x86)/NSIS/makensis.exe'
      - name: Replace only the current launcher downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python build/publish-launcher-v122.py
